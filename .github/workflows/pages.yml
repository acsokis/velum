name: Publish playable web build
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download published standalone game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r .tag releases/web-build.json)
          digest=$(jq -r .sha256 releases/web-build.json)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern VELUM-web.zip
          echo "$digest  VELUM-web.zip" | sha256sum --check
          # Windows Compress-Archive emits backslash paths; unzip returns 1 for that warning.
          unzip -q VELUM-web.zip -d release || test "$?" -eq 1
          test -f release/build-web/index.html
          cp -r release/licenses release/build-web/licenses
          touch release/build-web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/build-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish playable web build
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download published standalone game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-preview --repo "$GITHUB_REPOSITORY" --pattern VELUM-web.zip
          echo '2d889dcfa4534d58cef03c791ebcfa30a801116958128a4e3b35eb7e6c895ecf  VELUM-web.zip' | sha256sum --check
          unzip -q VELUM-web.zip -d release
          test -f release/build-web/index.html
          cp -r release/licenses release/build-web/licenses
          touch release/build-web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/build-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

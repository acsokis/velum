[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="velum_web"
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="*.gdshader,*.gdshaderinc,*.ogg,*.wav"
exclude_filter="runtime/*,.tools/*,build/*,build-rtx/*,build-web/*,dist/*,tests/*,tools/*,companion/*"
export_path="build-web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.tools/web/web_nothreads_debug.zip"
custom_template/release="res://.tools/web/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script src='presentation-state.js'></script>"
progressive_web_app/enabled=false

[preset.1]
name="WebFast"
platform="Web"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="velum_web,velum_web_fast"
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="*.gdshader,*.gdshaderinc,*.ogg,*.wav"
exclude_filter="runtime/*,.tools/*,build/*,build-rtx/*,build-web/*,dist/*,tests/*,tools/*,companion/*"
export_path="build-web/fast/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug="res://.tools/web/web_debug.zip"
custom_template/release="res://.tools/web/web_release.zip"
variant/extensions_support=false
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script src='presentation-state.js'></script>"
progressive_web_app/enabled=false

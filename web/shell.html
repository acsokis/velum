<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e13">
<title>VELUM</title>
$GODOT_HEAD_INCLUDE
<script>window.velumBootConfig=$GODOT_CONFIG;for(const file of Object.keys(window.velumBootConfig.fileSizes||{})){if(!/\.(wasm|pck)$/.test(file))continue;const link=document.createElement('link');link.rel='preload';link.as='fetch';link.crossOrigin='anonymous';link.href=file;document.head.appendChild(link);}</script>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#090e13;color:#e2ede9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#canvas{display:block;width:100%;height:100%;outline:none}button{font:inherit;cursor:pointer}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 36%,#18302d80,transparent 55%),#090e13;transition:opacity .6s ease}
#loading::before{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#87bdac30 1px,transparent 1px),linear-gradient(90deg,#87bdac30 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse,black,transparent 76%)}
.card{position:relative;width:min(100%,480px);text-align:center}.mark{position:relative;width:104px;height:132px;margin:0 auto 36px;border:1px solid #87bdac70;border-radius:49% 49% 44% 44%;box-shadow:inset 0 0 40px #80ddba0c,0 0 60px #80ddba0b;transform:rotate(-12deg)}.mark::before{content:"";position:absolute;inset:10px;border:1px solid #87bdac30;border-radius:inherit}.mark::after{content:"";position:absolute;inset:15px 48px;background:#9be4c8;box-shadow:0 0 22px #9be4c8;animation:breathe 2.5s ease-in-out infinite}
h1{font-size:clamp(30px,7vw,48px);font-weight:450;letter-spacing:.35em;margin:0 0 14px;padding-left:.35em}.subtitle{color:#8faaa2;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 42px}.status{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:#c7dbd3;text-align:left}.track{height:3px;background:#233a34;margin:15px 0 12px;overflow:hidden;border-radius:4px}.fill{width:0;height:100%;background:#9be4c8;box-shadow:0 0 15px #9be4c8;transition:width .3s linear}.indeterminate .fill{width:35%;animation:travel 1.8s ease-in-out infinite}.detail{font-size:12px;color:#7b968d;min-height:18px;text-align:left}.tip{font-size:13px;color:#8faaa2;margin-top:34px;min-height:36px}.footer{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.13em;color:#6a857a}.error{color:#f0b8a1}#retry{display:none;margin:24px auto 0;background:#9be4c8;color:#10241b;border:0;padding:12px 24px;border-radius:8px}#loading.done{opacity:0;pointer-events:none}
@keyframes breathe{50%{opacity:.3;transform:scaleY(.7)}}@keyframes travel{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="VELUM game">Your browser needs WebGL 2 to play VELUM.</canvas>
<section id="loading" aria-label="Loading VELUM">
<div class="card"><div class="mark" aria-hidden="true"></div><h1>VELUM</h1><p class="subtitle">Something is waking</p><div class="status"><span id="phase" role="status" aria-live="polite">Preparing your world</span><span id="amount"></span></div><div id="track" class="track indeterminate" role="progressbar" aria-label="Download progress"><div id="fill" class="fill"></div></div><div id="detail" class="detail">Connecting…</div><p id="tip" class="tip">Explore. Gather. Adapt.</p><button id="retry" type="button">Try again</button></div>
<div class="footer"><span>EXPLORATION / SURVIVAL</span><span id="connection">INITIALIZING</span></div>
</section>
<noscript>Enable JavaScript to play VELUM.</noscript>
<script src="$GODOT_URL"></script>
<script>
const config=window.velumBootConfig;
const engine=typeof Engine==='function'?new Engine(config):null;
const el=id=>document.getElementById(id);
let ready=false,failed=false,lastActivity=Date.now();
function stage(text){lastActivity=Date.now();el('phase').textContent=text;el('amount').textContent='';el('track').classList.add('indeterminate');el('track').removeAttribute('aria-valuenow');el('detail').textContent='Preparing the playable world…';}
function fail(){if(ready||failed)return;failed=true;el('phase').textContent='Unable to enter the world';el('phase').classList.add('error');el('track').classList.remove('indeterminate');el('detail').textContent=navigator.onLine?'Check WebGL support, then try again.':'You are offline. Reconnect, then try again.';el('retry').style.display='block';el('connection').textContent='CONNECTION INTERRUPTED';}
el('retry').addEventListener('click',()=>location.reload());
window.addEventListener('velum-loading',event=>{if(!failed&&!ready)stage(event.detail);});
window.addEventListener('velum-ready',()=>{if(failed)return;ready=true;el('phase').textContent='Your world is ready';el('track').classList.remove('indeterminate');el('fill').style.width='100%';el('detail').textContent='Press E to hatch.';el('connection').textContent='READY';requestAnimationFrame(()=>requestAnimationFrame(()=>{el('loading').classList.add('done');setTimeout(()=>el('loading')?.remove(),650);}));});
window.addEventListener('offline',()=>{if(!ready)el('detail').textContent='Connection lost. Waiting for your network…';});
window.addEventListener('online',()=>{if(!ready)el('detail').textContent='Connection restored. Continuing…';});
document.querySelector('canvas').addEventListener('webglcontextlost',fail);
setInterval(()=>{if(ready||failed)return;const idle=Date.now()-lastActivity;if(idle>20000)el('detail').textContent='Still preparing. First launch may take longer on this device.';if(idle>60000){el('detail').textContent='Taking longer than expected. You can retry if loading has stopped.';el('retry').style.display='block';}},5000);
if(!engine||Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED}).length){fail();}
else engine.startGame({onProgress:(current,total)=>{if(failed||ready)return;lastActivity=Date.now();el('connection').textContent='PRELOADING';if(total>0&&current>=0){const p=Math.min(100,current/total*100);el('phase').textContent=p>=100?'Opening the world':'Downloading the world';el('amount').textContent=Math.floor(p)+'%';el('track').classList.remove('indeterminate');el('fill').style.width=p+'%';el('track').setAttribute('aria-valuenow',String(Math.floor(p)));el('track').setAttribute('aria-valuemin','0');el('track').setAttribute('aria-valuemax','100');el('detail').textContent=(current/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB';}else stage('Downloading the world');}}).then(()=>{if(!ready&&!failed)stage('Bringing the world to life');}).catch(fail);
</script>
</body>
</html>
